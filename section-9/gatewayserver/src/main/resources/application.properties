spring.application.name=gatewayserver

spring.config.import=optional:configserver:http://localhost:8071

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=accounts_custom_route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ACCOUNTS
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eazybank/accounts/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/eazybank/accounts/(?<segment>.*), /${segment}

management.endpoints.web.exposure.include=*
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.probes.enabled=true

management.endpoint.gateway.access=unrestricted


info.app.name=${spring.application.name}
info.app.description=API Gateway Server
info.app.version=1.0.0

logging.level.com.bank.gatewayserver=DEBUG